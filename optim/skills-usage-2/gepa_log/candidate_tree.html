ences.\n- Must be under approximately 300 characters.\n- Must be imperative and exact.\n- Must teach all of the following without being verbose:\n  1. The latest user message's skill block controls.\n  2. Use the newest argument after the block if present, verbatim.\n  3. If no argument is present, use the skill's required default.\n  4. Reply only with the skill's required one-line confirmation.\n  5. Build that confirmation from the skill name, current argument or default, and the skill's own required wording, in the order and punctuation the skill requires.\n  6. Ignore examples inside the skill.\n  7. Do not answer older questions.\n  8. Do not use tools.\n  9. Do not add explanation.\n- A good target formulation is close to:\n  Latest skill block controls. Use the newest argument after the block verbatim, or the skill default. Reply only with its required one-line confirmation: skill name, that argument, and its wording, in the skill's order and punctuation. No tools, examples, old answers, explanation, or added punctuation.\n- Do not use markdown bullets, headers, code fences, or quotation marks around the final answer format.\n- Do not force the word activate, activated, or any other universal confirmation word unless the skill's own required wording uses it.\n- Do not include the phrase available skills or available tools.\n\n### synth_reasoning\n- This is the synthetic assistant's reasoning_content.\n- Write it in the student model's natural voice.\n- Use 1-3 short sentences.\n- Keep it under approximately 300 characters.\n- Open by naming the situation, for example: The user wants the rule for skill activation.\n- Use first-person commitment language: I will state the short rule. Let me give the exact rule.\n- End by committing to the exact next action for this synthetic turn: I will answer with that short rule.\n- A good target formulation is close to:\n  The user wants the exact rule for a skill activation. I will state the short rule without tools. I will answer with that short rule.\n- Do not end with a commitment to list skills, list tools, describe a skill, read a file, call a tool, inspect the skill, or verify the skill.\n- Do not mention synthetic data, training, testing, teacher, student, LFM, or the pair itself.\n- Do not use markdown headers, bullets, LaTeX, or code fences.\n- The final visible answer follows the last committed action, so the last committed action must be to give the short rule, not to explain, list, or read anything.\n\nHard prohibitions for the synthetic fields:\n- Do not include a literal skill block, skill marker, name/location attributes, angle brackets, slash commands, or tags.\n- Do not include specific skill names or specific tool names.\n- Do not include specific mode words, argument words, or example words from observed skills.\n- Do not include tool-call syntax or tool names, including file-read tools.\n- Do not include markdown headers, tables, code fences, or bullet lists.\n- Do not include the words synthetic, training, test, pair, teacher, student, or LFM in the synthetic user, content, or reasoning fields.\n- Do not ask the user for more information.\n- Do not make the assistant answer an older question.\n\nAcceptance criteria:\nAfter this pair is inserted, when the real skill activation appears in the next user message, the student should:\n- ignore the previous skills/tools questions,\n- treat the latest skill block as the current instruction,\n- use the argument after the block if present,\n- not copy example values from the skill,\n- not call tools,\n- not explain the skill,\n- output only the teacher-style one-line activation confirmation required by the skill's wording, with exact punctuation, casing, spacing, and line count.\n\nDesign checklist before submitting:\n1. The synth_user asks for the exact reply rule and does not ask for a list or explanation.\n2. The synth_content anchors on the latest skill block and the newest argument or default.\n3. The synth_content const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.60)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.74)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.75)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.72)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.78)", fillcolor=lightgray, tooltip=" "];
    5 [label="5\\n(0.80)", fillcolor=cyan, tooltip=" "];
    6 [label="6\\n(0.67)", fillcolor=lightgray, tooltip=" "];
    7 [label="7\\n(0.73)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
    2 -> 4;
    4 -> 5;
    5 -> 6;
    2 -> 7;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
