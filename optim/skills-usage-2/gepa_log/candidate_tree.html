ain facts you must preserve:\n- A skill activation is not a normal question. The harness injects the full skill instructions into the latest user message.\n- Once that block appears in the latest user message, the skill is active immediately.\n- The student must follow the skill instructions in that latest block.\n- If there is an argument after the block, that argument is the current argument and must be used.\n- If there is no argument after the block, use the skill's own required default wording.\n- A later activation with a different argument overrides the previous argument.\n- Skills are not tools.\n- A pure skill activation must be answered with text only. Do not call tools.\n- In the observed target cases, the teacher reply is a one-line activation confirmation built from the skill's own required wording and the current argument.\n- Do not add explanation, markdown, bullets, quotes, headings, or a trailing period to the activation reply unless the skill's required wording explicitly includes one.\n\nObserved failure modes you are correcting:\n- The student re-answers an older question, such as listing skills or tools, instead of following the latest skill block.\n- The student ignores the current argument and copies an example word from inside the skill.\n- The student adds explanatory text, markdown, bullets, or tool calls to a pure activation.\n- The student treats the synthetic corrective turn as another normal question to be answered later. It happens when the synthetic question is phrased in the second person (\"How should you answer...\") while the answer is in the first person (\"I will...\"): the question stays pending, and when the real activation arrives the student ANSWERS THAT QUESTION (explaining the rule) instead of acting. Prevent it: the synthetic question must be about the user's OWN latest message, first person, so the first-person answer closes it completely.\n- On a no-argument activation the student explains the rule instead of confirming. The pair must commit to confirming the skill's DEFAULT wording as the whole reply, never explaining.\n\nGeneralizable strategy:\nMake the synthetic pair a short first-person commitment to the activation rule. The visible assistant message should not merely advise in the second person; it should commit to the exact future behavior using \"I will\". The synthetic reasoning should end by committing to output only the required confirmation text, because the student tends to follow the action committed in its reasoning.\n\nWriting rules:\n\n### reasoning\n- Write 1-3 short meta sentences explaining why the pair corrects the failure.\n- Do not mention the student, teacher, spec, synthetic, or reasoning in a meta way beyond the required explanation.\n\n### synth_user\n- Make it a short FIRST-PERSON question about the user's own latest message, e.g. \"When a skill block is in my latest message, what do I do?\"\n- It must cover the activation with OR without an argument (both cases will happen).\n- Do not ask about available skills or available tools again.\n- Do not ask about a specific skill, path, mode, or observed argument.\n- Do not embed any skill markup or block in the synthetic user message.\n- Do not use a second-person question (\"How should you answer...\"): a pending second-person question gets answered with an explanation later.\n\n### synth_content\n- Keep it short, plain, and reusable.\n- Use first-person commitments like \"I will\" because this worked better than abstract advice.\n- It must explicitly teach all of the following:\n  1. Treat the skill instructions in the latest user message as the active instruction.\n  2. Use the argument after that skill block as the current argument.\n  3. If a later activation gives a different argument, the later argument wins.\n  4. If there is no argument, use the skill's own required default wording.\n  5. Do not copy example words from inside the skill; substitute the current argument into the required reply pattern.\n  6. Ignore earlier questions and older activations; do not re-answer them.\n  7. Reply text only with the exact required confirmation: skill name, current argument or default wording, and the skill's required wording.\n  8. Do not call tools; skills are not tools.\n  9. Do not add explanation, markdown, bullets, quotes, headings, or an extra trailing period unless the skill's required wording itself includes one.\n- A strong pattern is close to:\n  \"I will follow the latest active skill block, use the current argument word rather than an example, and ignore earlier questions. I will reply text only with the required confirmation: skill name, argument word, and required wording. I will not call tools.\"\n- If space allows, also state the no-argument case: \"If there is no argument, I will use the skill's required default wording.\"\n- Do not include any specific skill name, path, mode, observed argument, or exact target answer from the provided spec.\n\n### synth_reasoning\n- Write in the student's native reasoning voice.\n- Use 1-3 short plain sentences.\n- Open by naming the situation, for example: \"The user wants the rule for an active skill.\"\n- Commit to the action with \"I will\" or \"Let me\".\n- Include the key corrections: latest skill block, current argument, not example word, ignore earlier questions, text-only confirmation.\n- End by committing to the exact next action: replying only with the required confirmation, and make the commit cover the no-argument case too (confirm the skill's default wording as the whole reply, never an explanation).\n- Do not mention \"this is synthetic\", \"reasoning\", \"teacher\", \"spec\", or any meta context.\n- Do not use markdown headers, code fences, bullets, or long lists.\n\nHard constraints:\n- Do not mention any specific skill name from the spec in the synthetic fields.\n- Do not mention the observed user argument or exact observed teacher reply in the synthetic fields.\n- Do not include literal skill markup/tags in the synthetic fields. Use only the plain phrase \"skill block\" if needed.\n- Do not make the synthetic pair itself look like a real skill activation.\n- Keep each synthetic field terse, generally under about 300 characters.\n- The visible assistant message must be reusable for any future skill activation.\n\nBefore emitting, check:\n- If the next real user message contains a skill block with an argument, would this pair make the student output only the required confirmation?\n- Would the student use the argument after the latest block rather than an example word?\n- Would the student ignore the earlier skills/tools questions?\n- Would the student avoid tool calls?\n- If any answer is no, revise the pair."}},

const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.69)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.74)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.88)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.95)", fillcolor=cyan, tooltip=" "];
    0 -> 1;
    0 -> 2;
    2 -> 3;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
